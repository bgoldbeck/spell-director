# Creates a GitHub Release for the version in VERSION.
#
# Two ways to start it:
#   - push a version tag (v1.2.3) that matches VERSION, or
#   - click "Run workflow" on the Actions tab (on main); it creates the
#     v<VERSION> tag on that commit itself.
#
# This is release automation only: it runs no tests. Run the checks in
# CLAUDE.md locally before releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${version})" >&2
              exit 1
            fi
          elif [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Run this workflow from main, not ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "TAG=v${version}" >> "$GITHUB_ENV"

      - name: Pull release notes from CHANGELOG.md
        run: python3 tools/release_notes.py "${TAG}" > release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            where="--verify-tag"
          else
            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists; bump VERSION first" >&2
              exit 1
            fi
            where="--target ${GITHUB_SHA}"
          fi
          gh release create "${TAG}" \
            --title "SpellDirector ${TAG}" \
            --notes-file release-notes.md \
            ${where}
