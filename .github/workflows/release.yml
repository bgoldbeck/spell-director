# Creates a GitHub Release when a version tag (v1.2.3) is pushed.
# This is release automation only: it runs no tests. Run the checks in
# CLAUDE.md locally before tagging.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${version})" >&2
            exit 1
          fi

      - name: Pull release notes from CHANGELOG.md
        run: python3 tools/release_notes.py "${GITHUB_REF_NAME}" > release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "SpellDirector ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
